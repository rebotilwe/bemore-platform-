  # ────────────────────────────────────────────
  # Polls
  # ────────────────────────────────────────────
  /polls/active:
    get:
      tags: [Polls]
      summary: Get active poll (public)
      description: Returns the currently active poll with its questions and options. No auth required.
      security: []
      responses:
        '200':
          description: Active poll (or null if none active)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Poll'

  /polls:
    get:
      tags: [Polls]
      summary: List polls (admin)
      description: List all polls, optionally filtered by status.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, closed]
      responses:
        '200':
          description: Poll list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Poll'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Polls]
      summary: Create a poll (admin)
      description: Create a new poll with one or more questions. Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, questions]
              properties:
                title:
                  type: string
                  maxLength: 200
                  example: Summit Feedback
                description:
                  type: string
                  maxLength: 500
                questions:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/PollQuestion'
      responses:
        '201':
          description: Poll created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Poll'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /polls/{id}:
    get:
      tags: [Polls]
      summary: Get poll details (admin)
      parameters:
        - $ref: '#/components/parameters/PollId'
      responses:
        '200':
          description: Poll details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Poll'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Polls]
      summary: Update a poll (admin)
      description: Update poll title, description, or questions. Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/PollId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 500
                questions:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/PollQuestion'
      responses:
        '200':
          description: Poll updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Poll'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Polls]
      summary: Delete a poll (admin)
      description: Permanently delete a poll and all its responses. Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/PollId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Poll deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /polls/{id}/vote:
    post:
      tags: [Polls]
      summary: Submit a vote (public)
      description: |
        Submit a vote on an active poll question. Requires a sessionId for
        duplicate prevention. Rate limited to 60 votes per 15 minutes per session.
      security: []
      parameters:
        - $ref: '#/components/parameters/PollId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, sessionId]
              properties:
                questionId:
                  type: string
                  description: MongoDB ObjectId of the question
                sessionId:
                  type: string
                  description: Client-generated session identifier
                optionId:
                  type: string
                  description: MongoDB ObjectId of the selected option (for multiple-choice)
                textResponse:
                  type: string
                  maxLength: 200
                  description: Free-text response (for word-cloud or open-text)
                ratingValue:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Rating value (for rating type)
      responses:
        '200':
          description: Vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /polls/{id}/live:
    get:
      tags: [Polls]
      summary: Live poll results (SSE stream, public)
      description: |
        Server-Sent Events (SSE) stream that pushes real-time vote updates.
        The client receives `data:` frames with JSON payloads as votes arrive.
        Connection stays open until the client disconnects or the poll closes.
      security: []
      parameters:
        - $ref: '#/components/parameters/PollId'
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events with JSON data payloads

  /polls/{id}/status:
    patch:
      tags: [Polls]
      summary: Set poll status (admin)
      description: Change the status of a poll (draft, active, paused, closed). Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/PollId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, active, paused, closed]
      responses:
        '200':
          description: Poll status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Poll'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /polls/{id}/activate:
    patch:
      tags: [Polls]
      summary: Activate a specific question (admin)
      description: |
        Set the active question index for a poll. Use `-1` to deactivate all questions.
        Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/PollId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionIndex]
              properties:
                questionIndex:
                  type: integer
                  minimum: -1
                  description: Zero-based question index, or -1 to deactivate all
      responses:
        '200':
          description: Question activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Poll'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /polls/{id}/results:
    get:
      tags: [Polls]
      summary: Get poll results (admin)
      description: Aggregated results for all questions in a poll.
      parameters:
        - $ref: '#/components/parameters/PollId'
      responses:
        '200':
          description: Poll results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ────────────────────────────────────────────
  # Tracking (public, fire-and-forget)
  # ────────────────────────────────────────────
  /track/pageview:
    post:
      tags: [Tracking]
      summary: Track page view (public)
      description: |
        Records a page view event. Fire-and-forget — always returns 202 if validation
        passes. Server parses User-Agent for device/browser/OS info.
        Rate limited to 300 req/15min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, visitorId, path]
              properties:
                sessionId:
                  type: string
                  maxLength: 64
                visitorId:
                  type: string
                  maxLength: 64
                path:
                  type: string
                  maxLength: 500
                  example: /register
                referrer:
                  type: string
                  maxLength: 2000
                utmSource:
                  type: string
                  maxLength: 200
                utmMedium:
                  type: string
                  maxLength: 200
                utmCampaign:
                  type: string
                  maxLength: 200
                screenWidth:
                  type: integer
                screenHeight:
                  type: integer
      responses:
        '202':
          description: Page view accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid tracking data
        '429':
          $ref: '#/components/responses/RateLimited'

  /track/event:
    post:
      tags: [Tracking]
      summary: Track custom event (public)
      description: |
        Records a custom tracking event (click, form funnel step, interaction, etc.).
        Fire-and-forget — always returns 202 if validation passes.
        Rate limited to 300 req/15min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, visitorId, category, action]
              properties:
                sessionId:
                  type: string
                  maxLength: 64
                visitorId:
                  type: string
                  maxLength: 64
                category:
                  type: string
                  enum: [click, form_funnel, interaction, scroll, download]
                action:
                  type: string
                  maxLength: 200
                  example: cta_register_click
                label:
                  type: string
                  maxLength: 500
                value:
                  type: number
                  default: 0
                path:
                  type: string
                  maxLength: 500
                meta:
                  type: object
                  description: Additional metadata (max 1KB serialized)
                  additionalProperties: true
      responses:
        '202':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid tracking data
        '429':
          $ref: '#/components/responses/RateLimited'

  /track/heartbeat:
    post:
      tags: [Tracking]
      summary: Update page view duration (public)
      description: |
        Updates the duration field on an existing page view record. Used to track
        time-on-page. Fire-and-forget — always returns 202 if validation passes.
        Rate limited to 300 req/15min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, path, duration]
              properties:
                sessionId:
                  type: string
                  maxLength: 64
                path:
                  type: string
                  maxLength: 500
                duration:
                  type: number
                  description: Time on page in milliseconds
      responses:
        '202':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid heartbeat data
        '429':
          $ref: '#/components/responses/RateLimited'

  # ────────────────────────────────────────────
  # Admins
  # ────────────────────────────────────────────
  /admins:
    get:
      tags: [Admins]
      summary: List admin users
      description: Returns all admin accounts (email, name, creation date). Requires admin JWT.
      responses:
        '200':
          description: List of admin users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Admins]
      summary: Create admin user
      description: Create a new admin account. Requires admin JWT and CSRF token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 8
                name:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admins/{id}:
    patch:
      tags: [Admins]
      summary: Update admin user
      description: Update an admin's email, password, or name. Requires CSRF token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MongoDB ObjectId
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 8
                name:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Admin updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Admins]
      summary: Delete admin user
      description: Permanently delete an admin account. Requires CSRF token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MongoDB ObjectId
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Admin deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# ══════════════════════════════════════════════
# Components
# ══════════════════════════════════════════════
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: bm_token
      description: HttpOnly JWT cookie set by POST /auth/login

  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token from `bm_csrf` cookie (double-submit pattern)
      schema:
        type: string

    DateRange:
      name: range
      in: query
      description: Date range filter
      schema:
        type: string
        enum: ['7d', '30d', '90d', '1y']
        default: '30d'

    PollId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the poll
      schema:
        type: string

  schemas:
    ApplicationInput:
      type: object
      required: [userType, personal]
      properties:
        userType:
          type: string
          enum: [developer, landowner, investor, student, professional, aspiring]
          example: developer
        personal:
          type: object
          required: [firstName, surname, email, phone]
          properties:
            firstName:
              type: string
              maxLength: 100
              example: Thabo
            surname:
              type: string
              maxLength: 100
              example: Mokoena
            email:
              type: string
              format: email
              maxLength: 254
              example: thabo@example.co.za
            phone:
              type: string
              pattern: '^(\+?27\d{9}|0\d{9})$'
              example: '0821234567'
            companyName:
              type: string
              example: Mokoena Developments
        formData:
          type: object
          description: |
            Flexible form data from the 5-step registration process.
            Only whitelisted keys are accepted; unknown keys are stripped.
          properties:
            landStatus:
              type: string
              example: Land Secured
            projectStage:
              type: string
              example: Funding Stage
            estimatedValue:
              type: string
              example: R20m - R100m
            seeking:
              type: string
            previousFunding:
              type: string
            projectDescription:
              type: string
            summitAttendance:
              type: string
            tcAccepted:
              type: boolean
            popiaConsent:
              type: boolean
            yearsExperience:
              type: string
            developmentTypes:
              type: string
            landSize:
              type: string
            zoningStatus:
              type: string
            isServiced:
              type: string
            ownershipStructure:
              type: string
            investmentFocus:
              type: string
            investmentTicket:
              type: string
            bedCount:
              type: string
            occupancyRate:
              type: string
            universityPartnership:
              type: string
            assetType:
              type: string
            profession:
              type: string
            registrationStatus:
              type: string
            projectScale:
              type: string
            developmentInterests:
              type: string
            relevantExperience:
              type: string
            engagementSource:
              type: string
              example: qr

    Application:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        refNumber:
          type: string
          example: BM-09C5B0EF
        userType:
          type: string
          enum: [developer, landowner, investor, student, professional, aspiring]
        personal:
          type: object
          properties:
            firstName:
              type: string
            surname:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            companyName:
              type: string
        formData:
          type: object
        tags:
          type: array
          items:
            type: string
          example: [HIGH_VALUE, PIPELINE_READY]
        status:
          type: string
          enum: [new, reviewing, shortlisted, invited, funded]
        classification:
          type: string
          enum: [unclassified, hot, warm, cold]
        engagementSource:
          type: string
          example: qr
        adminNotes:
          type: string
        followUp:
          type: object
          properties:
            required:
              type: boolean
            dueDate:
              type: string
              format: date-time
            notes:
              type: string
            completedAt:
              type: string
              format: date-time
        dealRoom:
          type: object
          properties:
            summitAccess:
              type: boolean
            dealRoomEntry:
              type: boolean
            funders:
              type: array
              items:
                type: string
                enum: [PBSA]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Poll:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
          example: Summit Feedback
        description:
          type: string
        status:
          type: string
          enum: [draft, active, paused, closed]
        questions:
          type: array
          items:
            $ref: '#/components/schemas/PollQuestion'
        activeQuestionIndex:
          type: integer
          description: Currently active question index (-1 for none)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PollQuestion:
      type: object
      required: [text, type]
      properties:
        text:
          type: string
          maxLength: 500
          example: How useful was the summit?
        type:
          type: string
          enum: [multiple-choice, word-cloud, rating, open-text]
        options:
          type: array
          description: Required for multiple-choice questions
          items:
            type: object
            properties:
              _id:
                type: string
              text:
                type: string

    EmailLogEntry:
      type: object
      properties:
        to:
          type: string
          format: email
        subject:
          type: string
        template:
          type: string
          enum: [submission_confirmation, status_notification, summit_reminder]
        refNumber:
          type: string
        status:
          type: string
          enum: [sent, failed]
        error:
          type: string
          description: Error message if status is failed
        sentAt:
          type: string
          format: date-time

    AdminUser:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        error:
          type: 'null'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: 'null'
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
            requestId:
              type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8

  responses:
    Unauthorized:
      description: Authentication required or token invalid/expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: AUTH_TOKEN_INVALID
              message: Invalid or expired authentication token

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: NOT_FOUND
              message: Resource not found

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                - field: email
                  message: Valid email required

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: Too many requests. Please try again later.

security:
  - CookieAuth: []
