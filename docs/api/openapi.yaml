openapi: 3.1.0
info:
  title: BeMore SME Access Initiative API
  description: |
    API for the BeMore live engagement and data capture platform targeting South African
    property developers, landowners, student accommodation operators, and built environment
    professionals seeking institutional funding partnerships through PBSA.

    ## Authentication
    Admin endpoints use **HttpOnly cookie-based JWT** authentication. On successful login,
    the server sets two cookies:
    - `bm_token` — HttpOnly JWT cookie (not accessible via JavaScript)
    - `bm_csrf` — CSRF token cookie (readable by client)

    State-changing admin requests (POST, PATCH, PUT, DELETE) require the CSRF token
    sent via the `X-CSRF-Token` header (double-submit cookie pattern).

    ## Rate Limiting
    All endpoints are rate-limited. Standard headers (`RateLimit-*`) are returned.
    | Tier | Window | Max Requests | Applies To |
    |------|--------|-------------|------------|
    | Health | 1 min | 200 | `GET /health` |
    | Public | 15 min | 100/IP | Application submit, lookup, POPIA, public settings |
    | Admin | 15 min | 300 | All admin endpoints |
    | Auth | 15 min | 10 | `POST /auth/login` |
    | Vote | 15 min | 60/session | `POST /polls/:id/vote` |
    | Tracking | 15 min | 300/IP | `POST /track/*` |

    ## Application Status Flow
    `new` → `reviewing` → `shortlisted` → `invited` → `funded`

    ## Auto-Tagging
    Applications are automatically tagged on submission based on form data:
    `HIGH_VALUE`, `LARGE_CAPITAL`, `MID_VALUE`, `LAND_SECURED`, `FUNDING_STAGE`,
    `SHOVEL_READY`, `PIPELINE_READY`, `INSTITUTIONAL_GRADE`, `EXPERIENCED`,
    `STUDENT_FOCUS`, `LARGE_OPERATOR`, `REGISTERED`

    ## POPIA Compliance
    Public data-export and data-delete endpoints allow applicants to exercise their
    right to access and right to erasure under the Protection of Personal Information Act.
    A 24-month TTL index auto-deletes stale records.
  version: 3.0.0
  contact:
    name: Bukani Tech Solutions
    url: https://bts-app.co.za

servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://bemore-tawny.vercel.app/api
    description: Production (via Vercel rewrite to Railway)

tags:
  - name: Health
    description: System health checks
  - name: Auth
    description: Admin authentication (cookie-based JWT + CSRF)
  - name: Applications
    description: Application submission and management
  - name: POPIA
    description: Data rights endpoints (export, delete)
  - name: Analytics
    description: Dashboard analytics and audit event log
  - name: Traffic
    description: Site traffic analytics (page views, devices, referrers)
  - name: Reports
    description: Pre-built intelligence reports
  - name: Polls
    description: Live polling with SSE real-time updates
  - name: Settings
    description: Site settings (admin-configurable key-value store)
  - name: Emails
    description: Email delivery logs
  - name: Tracking
    description: Client-side analytics ingestion (fire-and-forget)
  - name: Admins
    description: Admin user management

paths:
  # ────────────────────────────────────────────
  # Health
  # ────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service health status. Rate limited to 200 req/min.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    description: Process uptime in seconds
                    example: 86400
        '429':
          $ref: '#/components/responses/RateLimited'

  # ────────────────────────────────────────────
  # Auth
  # ────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      description: |
        Authenticates an admin user. On success, sets `bm_token` (HttpOnly JWT) and
        `bm_csrf` (readable CSRF token) cookies. Returns the CSRF token in the response
        body so the client can store it for subsequent state-changing requests.
        Rate limited to 10 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@bemore.co.za
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful — JWT set in HttpOnly cookie
          headers:
            Set-Cookie:
              description: |
                Sets `bm_token` (HttpOnly, Secure, SameSite=Strict) and
                `bm_csrf` (SameSite=Strict) cookies with 8-hour expiry.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      expiresIn:
                        type: string
                        example: 8h
                      csrfToken:
                        type: string
                        description: CSRF token for state-changing requests (send as X-CSRF-Token header)
                        example: a1b2c3d4e5f6...
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid credentials
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Admin logout
      description: Clears authentication cookies. Requires valid JWT and CSRF token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Logged out — cookies cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify:
    get:
      tags: [Auth]
      summary: Verify JWT token
      description: Validates the current JWT cookie. Returns 200 if valid, 401 if expired or missing.
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Applications (Public)
  # ────────────────────────────────────────────
  /applications:
    post:
      tags: [Applications]
      summary: Submit application (public)
      description: |
        Submit a new application. Duplicate prevention is enforced — same email + userType
        combination returns 409 with the existing reference number. Phone numbers are
        normalized to +27 format. Auto-tagging is applied based on form data.
        Rate limited to 100 requests per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Duplicate application (same email + userType)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: An application with this email and category already exists
                  refNumber:
                    type: string
                    example: BM-09C5B0EF
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      tags: [Applications]
      summary: List applications (admin)
      description: Paginated, filterable list of all applications. Rate limited to 300 req/15min.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, reviewing, shortlisted, invited, funded, all]
        - name: userType
          in: query
          schema:
            type: string
            enum: [developer, landowner, investor, student, professional, aspiring, all]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          description: Field to sort by
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated list of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /applications/lookup:
    post:
      tags: [Applications]
      summary: Status lookup (public)
      description: |
        Allows applicants to check their application status using reference number and email.
        No authentication required. Rate limited to 100 req/15min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refNumber, email]
              properties:
                refNumber:
                  type: string
                  example: BM-09C5B0EF
                email:
                  type: string
                  format: email
                  example: thabo@example.co.za
      responses:
        '200':
          description: Application status found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      refNumber:
                        type: string
                        example: BM-09C5B0EF
                      firstName:
                        type: string
                        example: Thabo
                      userType:
                        type: string
                        enum: [developer, landowner, investor, student, professional, aspiring]
                      status:
                        type: string
                        enum: [new, reviewing, shortlisted, invited, funded]
                      tags:
                        type: array
                        items:
                          type: string
                      summitAccess:
                        type: boolean
                      submittedAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '404':
          description: No matching application found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: No application found. Please check your reference number and email.

  /applications/stats:
    get:
      tags: [Applications]
      summary: Application statistics (admin)
      description: Aggregated statistics for the admin dashboard.
      responses:
        '200':
          description: Aggregated statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /applications/export/csv:
    get:
      tags: [Applications]
      summary: Export applications as CSV (admin)
      description: |
        Downloads all applications as a CSV file. Formula injection prevention
        is applied (cells starting with `=`, `+`, `-`, `@` are prefixed).
      responses:
        '200':
          description: CSV file download
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="bemore-applications-2026-04-24.csv"
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /applications/bulk-status:
    post:
      tags: [Applications]
      summary: Bulk status update (admin)
      description: |
        Update status for up to 100 applications at once. Triggers email notifications
        for shortlisted, invited, and funded status changes. Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    description: MongoDB ObjectId
                  minItems: 1
                  maxItems: 100
                status:
                  type: string
                  enum: [new, reviewing, shortlisted, invited, funded]
      responses:
        '200':
          description: Bulk update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                        example: 15
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /applications/send-reminders:
    post:
      tags: [Applications]
      summary: Send summit reminder emails (admin)
      description: Send summit reminder emails to up to 100 applicants. Requires CSRF token.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    description: MongoDB ObjectId
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: Reminders sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sent:
                        type: integer
                        example: 25
        '401':
          $ref: '#/components/responses/Unauthorized'

  /applications/{id}:
    get:
      tags: [Applications]
      summary: Get single application (admin)
      description: Retrieve a single application by MongoDB ObjectId.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MongoDB ObjectId
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Applications]
      summary: Update application (admin)
      description: |
        Update application fields (status, classification, notes, deal room, follow-up).
        Status changes to shortlisted/invited/funded trigger email notifications.
        Requires CSRF token.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: MongoDB ObjectId
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [new, reviewing, shortlisted, invited, funded]
                adminNotes:
                  type: string
                classification:
                  type: string
                  enum: [hot, warm, cold, unclassified]
                followUp:
                  type: object
                  properties:
                    required:
                      type: boolean
                    dueDate:
                      type: string
                      format: date-time
                    notes:
                      type: string
                dealRoom:
                  type: object
                  properties:
                    summitAccess:
                      type: boolean
                    dealRoomEntry:
                      type: boolean
                    funders:
                      type: array
                      items:
                        type: string
                        enum: [PBSA]
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ────────────────────────────────────────────
  # POPIA Data Rights
  # ────────────────────────────────────────────
  /applications/data-export:
    post:
      tags: [POPIA]
      summary: Export applicant data (POPIA right to access)
      description: |
        Allows an applicant to download all their stored data using reference number
        and email. An analytics event (`popia.data_export`) is logged.
        Rate limited to 100 req/15min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refNumber, email]
              properties:
                refNumber:
                  type: string
                  example: BM-A1B2C3D4
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Full application data returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/data-delete:
    post:
      tags: [POPIA]
      summary: Permanently delete applicant data (POPIA right to erasure)
      description: |
        Permanently and irreversibly deletes all data for the matching application.
        Requires the `confirm` field to be exactly `"DELETE"`. An analytics event
        (`popia.data_deleted`) is logged. Rate limited to 100 req/15min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refNumber, email, confirm]
              properties:
                refNumber:
                  type: string
                  example: BM-A1B2C3D4
                email:
                  type: string
                  format: email
                confirm:
                  type: string
                  enum: [DELETE]
                  description: Must be exactly "DELETE" to confirm permanent deletion
      responses:
        '200':
          description: Data permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Your data has been permanently deleted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  # ────────────────────────────────────────────
  # Settings
  # ────────────────────────────────────────────
  /settings/public/{key}:
    get:
      tags: [Settings]
      summary: Read a public site setting
      description: |
        Returns the value of a publicly readable setting. Only whitelisted keys are
        accessible: `mentimeterEmbedId`, `mentimeter_id`, `polls_enabled`,
        `registrationOpen`, `platformAnnouncement`.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum: [mentimeterEmbedId, mentimeter_id, polls_enabled, registrationOpen, platformAnnouncement]
          example: polls_enabled
      responses:
        '200':
          description: Setting value
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      key:
                        type: string
                        example: polls_enabled
                      value: {}
        '404':
          description: Setting key not found or not publicly readable

  /settings:
    get:
      tags: [Settings]
      summary: Get all site settings (admin)
      description: Returns all stored settings as a key-value map.
      responses:
        '200':
          description: All settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    description: Key-value map of all settings
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/{key}:
    put:
      tags: [Settings]
      summary: Update a site setting (admin)
      description: |
        Updates a site setting value. Only whitelisted keys are accepted:
        `mentimeterEmbedId`, `mentimeter_id`, `polls_enabled`, `registrationOpen`,
        `maintenanceMode`, `platformAnnouncement`. Requires CSRF token.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum: [mentimeterEmbedId, mentimeter_id, polls_enabled, registrationOpen, maintenanceMode, platformAnnouncement]
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: The setting value (string, boolean, number, or object)
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Setting "polls_enabled" updated
        '400':
          description: Unknown setting key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unknown setting key: "invalid_key"'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Emails
  # ────────────────────────────────────────────
  /emails/{refNumber}:
    get:
      tags: [Emails]
      summary: Get email delivery history for an application (admin)
      description: |
        Returns up to 50 email log entries for the given reference number, sorted
        by date descending. Reference number must match format `BM-XXXX` (4-12 alphanumeric chars).
      parameters:
        - name: refNumber
          in: path
          required: true
          schema:
            type: string
            pattern: '^BM-[A-Z0-9]{4,12}$'
          example: BM-A1B2C3D4
      responses:
        '200':
          description: Email log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmailLogEntry'
        '400':
          description: Invalid reference number format
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
  # Analytics
  # ────────────────────────────────────────────
  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: KPI dashboard
      description: Key performance indicators for the admin dashboard.
      parameters:
        - $ref: '#/components/parameters/DateRange'
      responses:
        '200':
          description: Dashboard KPI data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/funnel:
    get:
      tags: [Analytics]
      summary: Conversion funnel
      description: Application status funnel showing counts at each stage.
      responses:
        '200':
          description: Funnel stage counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/trends:
    get:
      tags: [Analytics]
      summary: Submission trends
      description: Time-series data of application submissions.
      parameters:
        - name: granularity
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
        - $ref: '#/components/parameters/DateRange'
      responses:
        '200':
          description: Trend data points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/tags:
    get:
      tags: [Analytics]
      summary: Tag distribution and co-occurrence
      description: Analysis of auto-tag distribution and which tags commonly appear together.
      responses:
        '200':
          description: Tag analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/demographics:
    get:
      tags: [Analytics]
      summary: Demographics breakdown
      description: Breakdown of applicants by user type, engagement source, and other demographic fields.
      responses:
        '200':
          description: Demographics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/deal-room:
    get:
      tags: [Analytics]
      summary: Deal room analytics
      description: Metrics for deal room access, funder distribution, and summit attendance.
      responses:
        '200':
          description: Deal room metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/events:
    get:
      tags: [Analytics]
      summary: Audit event log (paginated)
      description: |
        Paginated log of system events (application submissions, admin actions,
        auth events, report views, system events).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: category
          in: query
          schema:
            type: string
            enum: [application, admin, auth, report, system]
      responses:
        '200':
          description: Paginated event log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        category:
                          type: string
                        actor:
                          type: object
                        target:
                          type: object
                        meta:
                          type: object
                        timestamp:
                          type: string
                          format: date-time
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ────────────────────────────────────────────
